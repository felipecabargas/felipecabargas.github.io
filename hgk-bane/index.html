<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Holbæk Gokart · preview</title>
<style>
  :root { color-scheme: dark; --bg: #0c0c0e; --fg: #f4f4f5; --muted: #a1a1aa; --line: #3f3f46; --red: #ef4444; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 16px/1.5 system-ui, sans-serif; padding: 24px max(16px, env(safe-area-inset-left, 0px)); }
  form { width: min(360px, 100%); display: grid; gap: 14px; }
  h1 { margin: 0 0 6px; font-size: 22px; }
  label { display: grid; gap: 6px; font-size: 14px; color: var(--muted); }
  input { font: inherit; color: var(--fg); background: #18181b; border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; }
  input:focus { outline: 2px solid var(--red); outline-offset: 1px; }
  button { font: 600 15px/1 system-ui, sans-serif; color: #fff; background: var(--red); border: 0; border-radius: 999px; padding: 13px; cursor: pointer; }
  .err { min-height: 1.5em; margin: 0; color: #fca5a5; font-size: 14px; }
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>Holbæk Gokart · preview</h1>
  <label>Brugernavn <input id="u" name="username" autocomplete="username" required></label>
  <label>Adgangskode <input id="p" name="password" type="password" autocomplete="current-password" required></label>
  <button>Log ind</button>
  <p class="err" id="e" role="alert"></p>
</form>
<script>
  // a light gate for a private preview: it hides the page from casual visitors, it does not encrypt it
  const HASH = "a9c63091e782a427318a14b8390a66bec6ba0943972637bfef804f5f4efea47a";
  const hex = (b) => [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, "0")).join("");
  document.getElementById("f").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const s = document.getElementById("u").value.trim() + ":" + document.getElementById("p").value;
    const h = hex(await crypto.subtle.digest("SHA-256", new TextEncoder().encode("hgk-bane|" + s)));
    if (h === HASH) { try { sessionStorage.setItem("hgk-bane", h); } catch (e) {} location.replace("tour.html"); }
    else document.getElementById("e").textContent = "Forkert brugernavn eller adgangskode.";
  });
</script>
</body>
</html>
